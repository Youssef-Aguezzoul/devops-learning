
name: My First CI Pipeline

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Say Hello
        run: echo "Hello DevOps!"

      - name: Check Ubuntu
        run: uname -a

      - name: List Files
        run: ls -la

      - name: Finish
        run: echo "My first workflow completed!"
